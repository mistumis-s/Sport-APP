services:
  postgres:
    image: postgres:16-alpine
    container_name: sport-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sport_app
      POSTGRES_USER: sport_app
      POSTGRES_PASSWORD: sport_app_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sport_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport_app -d sport_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sport_app_postgres_data:
